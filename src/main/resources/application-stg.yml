spring:
  datasource:
    url: jdbc:postgresql://stg-db:5432/gym_stg
    username: gym_stg
    password: stg_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.gymcrm: info
    org.springframework: warn

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET_STG}
  cors:
    allowed-origins: https://stg.example.com
