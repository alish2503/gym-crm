spring:
  datasource:
    url: jdbc:postgresql://stg-db:5432/gym_stg
    username: gym_stg
    password: stg_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    host: stg-rabbit.mycompany.com
    port: 5672
    username: stguser
    password: stgpass
    publisher-confirm-type: correlated
    publisher-returns: true

logging:
  level:
    com.gymcrm: INFO
    org.springframework: WARN
    org.springframework.amqp.rabbit.core.RabbitAdmin: INFO
    org.springframework.amqp.rabbit.connection: INFO

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET_STG}
  cors:
    allowed-origins: https://stg.example.com
