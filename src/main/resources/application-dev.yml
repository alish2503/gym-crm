spring:
  datasource:
    url: jdbc:postgresql://dev-db:5432/gym_dev
    username: gym_dev
    password: dev_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: dev-rabbit.mycompany.com
    port: 5672
    username: devuser
    password: devpass
    publisher-confirm-type: correlated
    publisher-returns: true

logging:
  level:
    com.gymcrm: DEBUG
    org.springframework: INFO
    org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG
    org.springframework.amqp.rabbit.connection: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: never

security:
  jwt:
    user:
      expiration-ms: 3600000
    service:
      expiration-ms: 300000
    secret: 8r7u6y5t4r3e2w1q0p9o8i7u6y5t4r3e
  login:
    max-attempts: 3
    block-minutes: 5
  cors:
    allowed-origins: http://dev.example.com
