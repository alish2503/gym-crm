spring.datasource.url=jdbc:postgresql://stg-db:5432/gym_stg
spring.datasource.username=gym_stg
spring.datasource.password=stg_pass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.gymcrm=info
logging.level.org.springframework=warn

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=never

security.jwt.secret=${JWT_SECRET_STG}
security.cors.allowed-origins=https://stg.example.com